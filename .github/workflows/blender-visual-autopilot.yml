name: Blender preview QA — ChatGPT Plus + Codex Cloud
on:
  workflow_call:
    inputs:
      project_slug:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      project_slug:
        description: 'Current project under projects/ (do not reuse older assets)'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: blender-preview-${{ github.ref }}-${{ inputs.project_slug }}
  cancel-in-progress: false

jobs:
  render-preview:
    name: Render real Blender evidence for ${{ inputs.project_slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROJECT_SLUG: ${{ inputs.project_slug }}
    steps:
      - uses: actions/checkout@v6

      - name: Validate project and required native Blender renderer
        run: |
          set -euo pipefail
          if [[ ! "$PROJECT_SLUG" =~ ^[a-z0-9][a-z0-9-]{1,62}$ ]]; then
            echo "::error::Invalid project slug"
            exit 1
          fi
          test -f "projects/$PROJECT_SLUG/render-preview.sh" || {
            echo "::error::Codex must prepare a native render-preview.sh for this project first."
            exit 1
          }
          echo "Rendering independent project: $PROJECT_SLUG"

      - name: Install Blender, FFmpeg and project requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender ffmpeg python3-venv
          if [[ -f "projects/$PROJECT_SLUG/ci-setup.sh" ]]; then
            bash "projects/$PROJECT_SLUG/ci-setup.sh"
          fi
          blender --version | head -n 2
          ffmpeg -version | head -n 1

      - name: Render actual Blender video and extract three QA images
        run: |
          python3 .github/scripts/blender_visual_loop.py render --slug "$PROJECT_SLUG" --round 0

      - name: Save real video, early/middle/late frames and QA metadata
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: blender-preview-${{ inputs.project_slug }}-${{ github.run_id }}
          path: .render-loop/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

      - name: Explain how Codex Cloud continues the iteration with Plus
        if: ${{ success() }}
        run: |
          {
            echo "## Blender preview rendered and verified"
            echo "Project: \`$PROJECT_SLUG\`"
            echo "Artifact: \`blender-preview-$PROJECT_SLUG-$GITHUB_RUN_ID\`"
            echo "Frames: beginning, middle and end of the REAL Blender preview."
            echo "Continue in the ChatGPT Plus Codex Cloud task: download this artifact,"
            echo "inspect its images and logs, edit only projects/$PROJECT_SLUG,"
            echo "and push a project-specific code change to rerender."
            echo "No OpenAI API key, external model charge, or unattended in-workflow Codex invocation."
          } >> "$GITHUB_STEP_SUMMARY"
